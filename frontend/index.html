<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product CRUD</title>

  <!-- Tailwind + DaisyUI via CDN -->
  <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.14/dist/full.min.css" rel="stylesheet" type="text/css">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body class="min-h-screen bg-base-200">

  <!-- Navbar -->
  <div class="navbar bg-base-100 shadow-md">
    <div class="flex-1">
      <span class="btn btn-ghost text-xl">📦 Product CRUD</span>
    </div>
    <div class="flex-none">
      <label class="swap swap-rotate btn btn-ghost btn-circle" title="Alternar tema">
        <input type="checkbox" id="theme-toggle">
        <span class="swap-off text-xl">☀️</span>
        <span class="swap-on text-xl">🌙</span>
      </label>
    </div>
  </div>

  <main class="container mx-auto max-w-3xl p-4 md:p-8 space-y-6">

    <!-- Formulário de adicionar -->
    <div class="card bg-base-100 shadow-xl">
      <form id="add-product-form" class="card-body">
        <h2 class="card-title">Adicionar produto</h2>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 items-end">
          <label class="form-control md:col-span-2">
            <div class="label"><span class="label-text">Nome</span></div>
            <input type="text" id="name" name="name" placeholder="Ex.: Teclado mecânico"
                   class="input input-bordered w-full" required>
          </label>
          <label class="form-control">
            <div class="label"><span class="label-text">Preço</span></div>
            <input type="number" id="price" name="price" placeholder="0,00" step="0.01" min="0"
                   class="input input-bordered w-full" required>
          </label>
        </div>
        <div class="card-actions justify-end mt-2">
          <button type="submit" class="btn btn-primary">Adicionar</button>
        </div>
      </form>
    </div>

    <!-- Lista de produtos -->
    <div class="card bg-base-100 shadow-xl">
      <div class="card-body">
        <div class="flex items-center justify-between">
          <h2 class="card-title">Produtos</h2>
          <span id="products-count" class="badge badge-neutral">0</span>
        </div>

        <div id="loading" class="flex justify-center py-6 hidden">
          <span class="loading loading-spinner loading-lg text-primary"></span>
        </div>

        <div id="empty-state" class="text-center text-base-content/60 py-6 hidden">
          Nenhum produto cadastrado ainda.
        </div>

        <ul id="products" class="menu bg-base-100 w-full p-0 gap-2"></ul>
      </div>
    </div>
  </main>

  <!-- Modal de edição -->
  <dialog id="update-modal" class="modal">
    <div class="modal-box">
      <h3 class="font-bold text-lg mb-4">Editar produto</h3>
      <form id="update-product-form" class="space-y-4">
        <input type="hidden" id="update-id">
        <label class="form-control">
          <div class="label"><span class="label-text">Nome</span></div>
          <input type="text" id="update-name" class="input input-bordered w-full" required>
        </label>
        <label class="form-control">
          <div class="label"><span class="label-text">Preço</span></div>
          <input type="number" id="update-price" step="0.01" min="0" class="input input-bordered w-full" required>
        </label>
        <div class="modal-action">
          <button type="button" id="update-cancel" class="btn btn-ghost">Cancelar</button>
          <button type="submit" class="btn btn-primary">Salvar</button>
        </div>
      </form>
    </div>
    <form method="dialog" class="modal-backdrop"><button>fechar</button></form>
  </dialog>

  <!-- Toasts -->
  <div id="toast-container" class="toast toast-end"></div>

  <script src="app.js"></script>
</body>
</html>
